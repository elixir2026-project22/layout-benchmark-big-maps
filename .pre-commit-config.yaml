repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      # Run the linter
      - id: ruff-check
        args: [ --fix, --show-fixes ]
      # Run the formatter
      - id: ruff-format

  # Add some general purpose useful hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Make sure that contained YAML files are well-formed
      - id: check-yaml
      # Trim trailing whitespace of all sorts
      - id: trailing-whitespace
        exclude: '\.svg$'
      # A file size limit. The gallery SVGs of the big models reach 850 kB, so
      # the limit here is 1 MB rather than the hook's usual 500 kB.
      - id: check-added-large-files
        args: [ --maxkb=1024 ]
      # Simple parser validation of e.g. pyproject.toml
      - id: check-toml
      # Unify file endings
      - id: end-of-file-fixer
        exclude: '\.svg$'

  # GitHub Actions Workflow linter
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
